[project]
name = "iac-guard-mcp"
version = "0.1.0"
description = "review_diff: Checkov or builtin regex policies over Terraform/Bicep fixtures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
iac-guard = "iac_guard.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
